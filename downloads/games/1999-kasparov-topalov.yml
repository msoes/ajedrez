title: Kasparov's Immortal
white: Garry Kasparov
black: Veselin Topalov
result: "1-0"
date: 1999-01-20
event: Hoogovens tournament, round 4
site: Wijk aan Zee, Netherlands
opening: Pirc Defence
eco: B07

why: >
  Kasparov sacrifices a rook on move 24 and drives the black king from b8
  to d1. Known as Kasparov's Immortal.

result_note: >
  The soundness of the combination is disputed. Topalov could have
  declined the rook with 24...Kb6.

