why: >
  Kavalek sacrifices a piece, then one exchange, then the other exchange to
  push his avalanche of pawns down the board. By the end of the game, he has
  lost all seven of his pieces but kept all eight of his pawns, which roll
  over Gufeld's remaining rook and three pawns.

