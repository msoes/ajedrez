title: The Immortal Zugzwang Game
white: Friedrich Sämisch
black: Aron Nimzowitsch
result: "0-1"
date: 1923-03-09
event: Copenhagen tournament, round 6
site: Copenhagen, Denmark
opening: Queen's Indian Defence
eco: E18
orientation: black

why: >
  Nimzowitsch's last move leaves White with no move that does not lose
  material. Known as the Immortal Zugzwang Game.

result_note: >
  Whether the final position is a true zugzwang is disputed; Soltis notes
  that White could have moved a piece and played on.

moves: |
  1. d4 Nf6 2. c4 e6 3. Nf3 b6 4. g3 Bb7 5. Bg2 Be7 6. Nc3 O-O 7. O-O d5
  8. Ne5 c6 9. cxd5?! cxd5 10. Bf4 a6 11. Rc1 b5 12. Qb3 Nc6 13. Nxc6
  Bxc6 14. h3?! Qd7 15. Kh2 Nh5 16. Bd2 f5 17. Qd1 b4! 18. Nb1 Bb5
  19. Rg1 Bd6 20. e4? fxe4!! 21. Qxh5 Rxf2 22. Qg5? Raf8 23. Kh1?! R8f5
  24. Qe3 Bd3 25. Rce1 h6!!

