title: Yuri S Gusev vs E Auerbach, 1946
white: Yuri S Gusev
black: E Auerbach
result: "1-0"
date: 1946
event: Molniya Sporting Society
site: Chelyabinsk URS
eco: B72

why: >
  Known as "Gusev's Immortal". This game was contested between relatively
  obscure players Gusev and Auerbach (not to be confused with late centenarian
  grandmaster and theoretician Yuri Averbakh) in an equally obscure minor
  tournament. National Master Sam Copeland ranked it the second-best game of
  the 1940s. Grandmaster Simon Williams called the queen sacrifice in this
  game one of the most beautiful ideas he had ever seen.

