title: The Mate Steinitz Demonstrated
white: Wilhelm Steinitz
black: Curt von Bardeleben
result: "1-0"
date: 1895-08-17
event: Hastings international tournament, round 10
site: Hastings, England
opening: Italian Game, Giuoco Piano
eco: C54

why: >
  Steinitz gives four consecutive rook checks with the rook en prise
  throughout.

result_note: >
  Von Bardeleben did not resign over the board. By the usual account he
  left the hall and lost on time, and Steinitz demonstrated the mate
  afterwards.

