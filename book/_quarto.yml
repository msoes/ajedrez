project:
  type: book
  output-dir: ../_site
  resources:
  - assets
  - downloads
book:
  title: Historical Chess Games
  subtitle: Famous games in algebraic notation
  author: Diego Sandoval
  date: last-modified
  search: true
  site-url: https://twaclaw.github.io/ajedrez/
  favicon: assets/favicon.png
  description: Famous chess games.
  open-graph: true
  twitter-card: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: Licensed [GPL-3.0-or-later](https://www.gnu.org/licenses/gpl-3.0.html), as is the [board viewer](https://github.com/lichess-org/pgn-viewer)
      this book embeds.
    right: '[Source](https://github.com/twaclaw/ajedrez)'
  chapters:
  - index.qmd
  - timeline.qmd
  - part: The early game
    chapters:
    - games/1475-castellvi-vinyoles.qmd
