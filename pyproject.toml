[project]
name = "chess-games"
version = "0.1.0"
description = "Historical chess games in algebraic notation, sourced, annotated and playable on a board"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    # The board. Every move of every game is replayed on it before it is published.
    "chess>=1.11",
    # Reads the game records, and rewrites the Quarto book's _quarto.yml.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed to screenshot the rendered book while working on its styling.
dev = ["playwright>=1.40"]

[tool.uv]
package = false
