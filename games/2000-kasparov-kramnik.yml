why: >
  Kramnik revives the Berlin Defence, which had fallen out of favor, and in
  the most popular variation of which the queens are exchanged on move 8. The
  queenless endgame is difficult for Kramnik to defend but limits Kasparov's
  options, and the game ends in draw by agreement.

