why: >
  This game between Alekhine and Bogoljubow is referred to in the famous
  novella The Royal Game by Stefan Zweig. In the story, the position after
  38.d6 is reproduced in a game between the fictional world chess champion as
  White and a group of outmatched amateur players who are on the verge of
  promoting their c-pawn as Black, when an unknown spectator frantically
  intervenes and explains how White will beat them in 9−10 moves after
  38...c1=Q 39.Bxc1 Nxc1 40.d7. He instead proposes 38...Kh7, correctly
  predicting that 39.h4 will follow, and after 39...Rc4 he manoeuvres the game
  for 7−8 more moves until the world champion settles for a draw.

